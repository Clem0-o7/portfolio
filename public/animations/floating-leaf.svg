<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes floatLeaf {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(10px, 5px) rotate(5deg); }
        66% { transform: translate(5px, -5px) rotate(-3deg); }
      }
      @keyframes tinyRipple {
        0% { transform: scale(0.5); opacity: 0.6; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .leaf {
        transform-origin: 60px 60px;
        animation: floatLeaf 8s ease-in-out infinite;
      }
      .tr1 { transform-origin: 60px 65px; animation: tinyRipple 3s linear infinite; }
      .tr2 { transform-origin: 60px 65px; animation: tinyRipple 3s linear 1.5s infinite; }
    </style>
</defs>

<!-- Water Background -->
<rect width="120" height="120" fill="#172554" opacity="0.5"></rect>

<g class="leaf">
  <!-- Ripples emitted from leaf -->
  <ellipse class="tr1" cx="60" cy="65" rx="15" ry="6" fill="none" stroke="#3b82f6" stroke-width="1"></ellipse>
  <ellipse class="tr2" cx="60" cy="65" rx="15" ry="6" fill="none" stroke="#60a5fa" stroke-width="1"></ellipse>

  <!-- Leaf Shape -->
  <path d="M50 40 Q75 40 80 60 Q70 80 50 60 Q40 50 50 40 Z" fill="#15803d" stroke="#166534" stroke-width="1.5"></path>
  <!-- Leaf Vein -->
  <path d="M50 40 Q65 55 80 60" fill="none" stroke="#166534" stroke-width="1"></path>
  <path d="M58 50 L55 58 M65 53 L62 62 M70 56 L68 62" fill="none" stroke="#166534" stroke-width="0.5"></path>
</g>

</svg>
