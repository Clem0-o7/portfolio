<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes mushBop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes glowFade {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(167, 139, 250, 0.4)); }
        50% { filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.9)); }
      }
      .m1 { animation: mushBop 3s ease-in-out infinite, glowFade 3s ease-in-out infinite; transform-origin: 40px 80px; }
      .m2 { animation: mushBop 2.5s ease-in-out 0.5s infinite, glowFade 2.5s ease-in-out 0.5s infinite; transform-origin: 70px 70px; }
      .m3 { animation: mushBop 3.5s ease-in-out 1s infinite, glowFade 3.5s ease-in-out 1s infinite; transform-origin: 85px 85px; }
      
      @keyframes blinkDot {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .bd { animation: blinkDot 2s infinite; }
    </style>
</defs>

<!-- Mossy Log / Ground -->
<path d="M20 95 Q60 85 100 95 L95 105 Q60 95 25 105 Z" fill="#064e3b"></path>
<path d="M30 98 Q60 90 90 98" fill="none" stroke="#047857" stroke-width="2"></path>

<!-- Mushroom 1 -->
<g class="m1">
  <path d="M38 92 C38 85 39 82 40 80 C41 82 42 85 42 92 Z" fill="#fef3c7"></path>
  <ellipse cx="40" cy="80" rx="12" ry="4" fill="#c4b5fd"></ellipse>
  <path d="M25 80 C25 65 55 65 55 80 Z" fill="#7c3aed"></path>
  <circle cx="35" cy="72" r="2" fill="#a78bfa"></circle>
  <circle cx="48" cy="75" r="3" fill="#a78bfa"></circle>
</g>

<!-- Mushroom 2 (Tall) -->
<g class="m2">
  <path d="M68 88 C68 75 69 72 70 70 C71 72 72 75 72 88 Z" fill="#fef3c7"></path>
  <ellipse cx="70" cy="70" rx="14" ry="5" fill="#c4b5fd"></ellipse>
  <path d="M52 70 C52 50 88 50 88 70 Z" fill="#6d28d9"></path>
  <circle cx="62" cy="60" r="3" fill="#a78bfa"></circle>
  <circle cx="78" cy="65" r="2" fill="#a78bfa"></circle>
</g>

<!-- Mushroom 3 (Small) -->
<g class="m3">
  <path d="M84 98 C84 92 84.5 90 85 88 C85.5 90 86 92 86 98 Z" fill="#fef3c7"></path>
  <ellipse cx="85" cy="88" rx="8" ry="3" fill="#c4b5fd"></ellipse>
  <path d="M75 88 C75 78 95 78 95 88 Z" fill="#8b5cf6"></path>
  <circle cx="82" cy="83" r="1.5" fill="#a78bfa"></circle>
</g>

<!-- Ambient Magic Dots -->
<circle class="bd" cx="50" cy="60" r="1.5" fill="#e9d5ff" style="animation-delay: 0s"></circle>
<circle class="bd" cx="30" cy="65" r="1" fill="#e9d5ff" style="animation-delay: 1s"></circle>
<circle class="bd" cx="85" cy="70" r="2" fill="#e9d5ff" style="animation-delay: 0.5s"></circle>

</svg>
