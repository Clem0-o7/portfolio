<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes rainDrop {
        0% { transform: translateY(-20px) scaleY(1); opacity: 0; }
        10% { opacity: 0.8; }
        80% { transform: translateY(100px) scaleY(2); opacity: 0.8; }
        90% { transform: translateY(110px) scaleY(0.5); opacity: 0; }
        100% { transform: translateY(120px) scaleY(0); opacity: 0; }
      }
      @keyframes splash {
        0%, 80% { transform: scale(0); opacity: 0; }
        85% { transform: scale(1); opacity: 0.8; stroke-width: 2px; }
        100% { transform: scale(2); opacity: 0; stroke-width: 0px; }
      }
      .r1 { animation: rainDrop 1.5s linear infinite; }
      .s1 { transform-origin: 30px 100px; animation: splash 1.5s linear infinite; }
      
      .r2 { animation: rainDrop 1.2s linear 0.4s infinite; }
      .s2 { transform-origin: 70px 95px; animation: splash 1.2s linear 0.4s infinite; }
      
      .r3 { animation: rainDrop 1.8s linear 0.8s infinite; }
      .s3 { transform-origin: 50px 110px; animation: splash 1.8s linear 0.8s infinite; }
      
      .r4 { animation: rainDrop 1.4s linear 0.2s infinite; }
      .s4 { transform-origin: 90px 105px; animation: splash 1.4s linear 0.2s infinite; }
    </style>
</defs>

<!-- Dark Rainy Background -->
<rect width="120" height="120" fill="#0f172a" opacity="0.6"></rect>
<path d="M0 90 L120 90 L120 120 L0 120 Z" fill="#1e293b" opacity="0.8"></path>

<!-- Rain Drop 1 -->
<line class="r1" x1="30" y1="0" x2="30" y2="10" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"></line>
<ellipse class="s1" cx="30" cy="100" rx="4" ry="1.5" fill="none" stroke="#93c5fd"></ellipse>

<!-- Rain Drop 2 -->
<line class="r2" x1="70" y1="0" x2="70" y2="15" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"></line>
<ellipse class="s2" cx="70" cy="95" rx="3" ry="1" fill="none" stroke="#bfdbfe"></ellipse>

<!-- Rain Drop 3 -->
<line class="r3" x1="50" y1="0" x2="50" y2="12" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"></line>
<ellipse class="s3" cx="50" cy="110" rx="5" ry="2" fill="none" stroke="#60a5fa"></ellipse>

<!-- Rain Drop 4 -->
<line class="r4" x1="90" y1="0" x2="90" y2="10" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"></line>
<ellipse class="s4" cx="90" cy="105" rx="4" ry="1.5" fill="none" stroke="#93c5fd"></ellipse>

</svg>
