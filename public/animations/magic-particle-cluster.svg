<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes floatCluster {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes spinOrb {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes particleFloat {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
      }
      .cluster-center {
        transform-origin: 60px 60px;
        animation: floatCluster 4s ease-in-out infinite, spinOrb 12s linear infinite;
      }
      .p1 { --tx: -20px; --ty: -30px; animation: particleFloat 3s linear infinite; }
      .p2 { --tx: 30px; --ty: -20px; animation: particleFloat 4s linear 1s infinite; }
      .p3 { --tx: 10px; --ty: 30px; animation: particleFloat 3.5s linear 0.5s infinite; }
      .p4 { --tx: -25px; --ty: 15px; animation: particleFloat 4.5s linear 2s infinite; }
    </style>
</defs>

<g class="cluster-center">
  <!-- Core Orbs -->
  <circle cx="60" cy="60" r="12" fill="#c084fc" opacity="0.3"></circle>
  <circle cx="56" cy="56" r="6" fill="#e879f9" opacity="0.8"></circle>
  <circle cx="65" cy="63" r="5" fill="#38bdf8" opacity="0.8"></circle>
  <circle cx="62" cy="54" r="3" fill="#f472b6"></circle>
  
  <!-- Rings -->
  <ellipse cx="60" cy="60" rx="18" ry="6" fill="none" stroke="#e879f9" stroke-width="1" transform="rotate(30 60 60)"></ellipse>
  <ellipse cx="60" cy="60" rx="20" ry="4" fill="none" stroke="#38bdf8" stroke-width="1" transform="rotate(-45 60 60)"></ellipse>
</g>

<!-- Escaping Particles -->
<circle class="p1" cx="60" cy="60" r="1.5" fill="#e879f9"></circle>
<circle class="p2" cx="60" cy="60" r="2" fill="#38bdf8"></circle>
<circle class="p3" cx="60" cy="60" r="1" fill="#f472b6"></circle>
<circle class="p4" cx="60" cy="60" r="1.5" fill="#c084fc"></circle>

</svg>
