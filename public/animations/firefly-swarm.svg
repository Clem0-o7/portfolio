<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes swarmDrift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(20px, -10px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.1; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 4px #bef264); }
      }
      .swarm { animation: swarmDrift 10s ease-in-out infinite; }
      .f1 { animation: blink 3s infinite; }
      .f2 { animation: blink 2.5s infinite; animation-delay: 0.5s; }
      .f3 { animation: blink 4s infinite; animation-delay: 1.2s; }
      .f4 { animation: blink 3.2s infinite; animation-delay: 2s; }
      .f5 { animation: blink 2.8s infinite; animation-delay: 0.8s; }
    </style>
</defs>

<g class="swarm">
  <!-- Firefly 1 -->
  <circle class="f1" cx="30" cy="40" r="2" fill="#bef264"></circle>
  <!-- Firefly 2 -->
  <circle class="f2" cx="70" cy="30" r="1.5" fill="#bef264"></circle>
  <!-- Firefly 3 -->
  <circle class="f3" cx="50" cy="80" r="2.5" fill="#a3e635"></circle>
  <!-- Firefly 4 -->
  <circle class="f4" cx="90" cy="60" r="1.5" fill="#bef264"></circle>
  <!-- Firefly 5 -->
  <circle class="f5" cx="40" cy="60" r="2" fill="#d9f99d"></circle>
</g>

<!-- Independent Fireflies -->
<circle class="f2" cx="20" cy="80" r="1.5" fill="#d9f99d"></circle>
<circle class="f1" cx="100" cy="20" r="2" fill="#a3e635"></circle>
<circle class="f4" cx="80" cy="90" r="1.5" fill="#bef264"></circle>

</svg>
