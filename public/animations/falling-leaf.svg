<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes fall {
        0% { transform: translate(-20px, -40px) rotate(-15deg); opacity: 0; }
        10% { opacity: 1; }
        40% { transform: translate(30px, 20px) rotate(30deg); }
        70% { transform: translate(0px, 70px) rotate(-10deg); }
        90% { opacity: 1; }
        100% { transform: translate(40px, 120px) rotate(45deg); opacity: 0; }
      }
      .falling-leaf {
        animation: fall 6s ease-in-out infinite;
      }
      .f2 { animation: fall 7s ease-in-out 2.5s infinite; transform-origin: 30px 0px; }
    </style>
</defs>

<!-- Autumn colored leaves falling -->
<g class="falling-leaf">
  <path d="M60 40 Q70 30 75 45 Q85 50 75 60 Q70 75 60 65 Q50 75 45 60 Q35 50 45 45 Q50 30 60 40 Z" fill="#ea580c"></path>
  <path d="M60 40 L60 65" fill="none" stroke="#9a3412" stroke-width="1"></path>
</g>

<g class="f2">
  <path d="M30 20 Q40 10 45 25 Q55 30 45 40 Q40 55 30 45 Q20 55 15 40 Q5 30 15 25 Q20 10 30 20 Z" fill="#ca8a04"></path>
  <path d="M30 20 L30 45" fill="none" stroke="#854d0e" stroke-width="1"></path>
</g>

</svg>
