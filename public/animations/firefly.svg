<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes floatPath {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-10px, -15px); }
        50% { transform: translate(5px, -20px); }
        75% { transform: translate(15px, -5px); }
      }
      @keyframes pulseAura {
        0%, 100% { r: 6; opacity: 0.2; }
        50% { r: 12; opacity: 0.6; }
      }
      @keyframes wingFlap {
        0%, 100% { transform: rotateY(0deg); }
        50% { transform: rotateY(70deg); }
      }
      .firefly-group {
        animation: floatPath 8s ease-in-out infinite;
      }
      .aura {
        animation: pulseAura 2s ease-in-out infinite;
        transform-origin: center;
      }
      .wing-l {
        transform-origin: 60px 60px;
        animation: wingFlap 0.1s linear infinite;
      }
      .wing-r {
        transform-origin: 60px 60px;
        animation: wingFlap 0.1s linear infinite reverse;
      }
    </style>
</defs>

<!-- Night Background Element -->
<circle cx="60" cy="60" r="50" fill="#172554" opacity="0.1"></circle>

<g class="firefly-group">
  <!-- Glowing Aura -->
  <circle class="aura" cx="60" cy="62" r="10" fill="#bef264" opacity="0.4"></circle>
  <circle class="aura" cx="60" cy="62" r="6" fill="#bef264" opacity="0.8" style="animation-delay: 0.5s;"></circle>

  <!-- Body -->
  <ellipse cx="60" cy="60" rx="3" ry="5" fill="#3f6212"></ellipse>
  
  <!-- Glowing Tail -->
  <ellipse cx="60" cy="64" rx="2.5" ry="3" fill="#bef264"></ellipse>

  <!-- Wings -->
  <g class="wing-l">
    <ellipse cx="56" cy="58" rx="4" ry="2" fill="#e2e8f0" opacity="0.7" transform="rotate(-30 56 58)"></ellipse>
  </g>
  <g class="wing-r">
    <ellipse cx="64" cy="58" rx="4" ry="2" fill="#e2e8f0" opacity="0.7" transform="rotate(30 64 58)"></ellipse>
  </g>
</g>

</svg>
