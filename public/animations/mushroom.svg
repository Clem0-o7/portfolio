<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes mushBreathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.9)); }
      }
      @keyframes floatSpore {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
      }
      .mushroom-cap {
        transform-origin: 60px 70px;
        animation: mushBreathe 4s ease-in-out infinite;
      }
      .spore-1 { animation: floatSpore 3s ease-in infinite; transform-origin: 40px 60px; }
      .spore-2 { animation: floatSpore 4s ease-in 1.5s infinite; transform-origin: 80px 70px; }
      .spore-3 { animation: floatSpore 3.5s ease-in 0.5s infinite; transform-origin: 60px 50px; }
    </style>
</defs>

<!-- Ground -->
<path d="M30 105 Q60 95 90 105" fill="none" stroke="#29180c" stroke-width="4" stroke-linecap="round"></path>
<path d="M40 100 Q60 95 80 100" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"></path>

<!-- Mushroom Stem -->
<path d="M55 100 C 55 80, 58 75, 60 70 C 62 75, 65 80, 65 100 Z" fill="#fef3c7"></path>

<!-- Mushroom Cap -->
<g class="mushroom-cap">
  <!-- Glowing Underbelly -->
  <ellipse cx="60" cy="70" rx="20" ry="6" fill="#6ee7b7"></ellipse>
  <!-- Cap Top -->
  <path d="M35 70 C 35 45, 85 45, 85 70 Z" fill="#047857"></path>
  <!-- Pixel Dots on Cap -->
  <rect x="45" y="55" width="6" height="4" rx="1" fill="#34d399"></rect>
  <rect x="65" y="60" width="8" height="6" rx="2" fill="#34d399"></rect>
  <rect x="58" y="50" width="5" height="5" rx="1" fill="#34d399"></rect>
</g>

<!-- Spores -->
<circle class="spore-1" cx="40" cy="60" r="1.5" fill="#a7f3d0"></circle>
<circle class="spore-2" cx="80" cy="70" r="2" fill="#6ee7b7"></circle>
<circle class="spore-3" cx="60" cy="50" r="1" fill="#34d399"></circle>

</svg>
