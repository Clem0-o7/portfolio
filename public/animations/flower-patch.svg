<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes popWind {
        0%, 100% { transform: skewX(-2deg); }
        50% { transform: skewX(2deg); }
      }
      @keyframes blinkDew {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.5); }
      }
      @keyframes flowerBop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .grass-patch { transform-origin: 60px 100px; animation: popWind 3s ease-in-out infinite; }
      .bop-1 { animation: flowerBop 2s ease-in-out infinite; }
      .bop-2 { animation: flowerBop 2.5s ease-in-out infinite; animation-delay: 0.5s; }
      .bop-3 { animation: flowerBop 1.8s ease-in-out infinite; animation-delay: 1s; }
      .dew { animation: blinkDew 2s infinite; }
    </style>
</defs>

<!-- Soil Base -->
<path d="M20 100 C 40 95, 80 95, 100 100 C 95 105, 25 105, 20 100 Z" fill="#29180c"></path>
<path d="M30 102 C 50 98, 70 98, 90 102" fill="none" stroke="#451a03" stroke-width="2"></path>

<!-- Grass & Flowers -->
<g class="grass-patch">
  <!-- Back Grass -->
  <path d="M35 100 L30 80 L38 98 Z" fill="#065f46"></path>
  <path d="M50 98 L55 70 L58 95 Z" fill="#065f46"></path>
  <path d="M80 99 L85 75 L75 97 Z" fill="#065f46"></path>

  <!-- Front Grass -->
  <path d="M45 100 L40 75 L48 98 Z" fill="#10b981"></path>
  <path d="M60 100 L62 65 L65 98 Z" fill="#10b981"></path>
  <path d="M70 100 L68 80 L75 98 Z" fill="#10b981"></path>

  <!-- Small Flowers -->
  <g class="bop-1" transform="translate(40, 75)">
    <circle cx="0" cy="-5" r="4" fill="#60a5fa"></circle>
    <circle cx="-5" cy="0" r="4" fill="#60a5fa"></circle>
    <circle cx="5" cy="0" r="4" fill="#60a5fa"></circle>
    <circle cx="0" cy="5" r="4" fill="#60a5fa"></circle>
    <circle cx="0" cy="0" r="2.5" fill="#facc15"></circle>
  </g>

  <g class="bop-2" transform="translate(62, 65)">
    <circle cx="0" cy="-4" r="3.5" fill="#f472b6"></circle>
    <circle cx="-4" cy="0" r="3.5" fill="#f472b6"></circle>
    <circle cx="4" cy="0" r="3.5" fill="#f472b6"></circle>
    <circle cx="0" cy="4" r="3.5" fill="#f472b6"></circle>
    <circle cx="0" cy="0" r="2" fill="#facc15"></circle>
  </g>

  <g class="bop-3" transform="translate(80, 85)">
    <circle cx="0" cy="-3" r="3" fill="#fbbf24"></circle>
    <circle cx="-3" cy="0" r="3" fill="#fbbf24"></circle>
    <circle cx="3" cy="0" r="3" fill="#fbbf24"></circle>
    <circle cx="0" cy="3" r="3" fill="#fbbf24"></circle>
    <circle cx="0" cy="0" r="1.5" fill="#78350f"></circle>
  </g>
</g>

<!-- Morning Dew/Magic -->
<circle class="dew" cx="50" cy="80" r="1.5" fill="#bae6fd" style="animation-delay: 0.2s"></circle>
<circle class="dew" cx="72" cy="70" r="1" fill="#bae6fd" style="animation-delay: 1.5s"></circle>
<circle class="dew" cx="42" cy="90" r="1.5" fill="#bae6fd" style="animation-delay: 0.7s"></circle>

</svg>
