<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes twinkle {
        0%, 100% { transform: scale(1); opacity: 0.3; filter: drop-shadow(0 0 2px #fde047); }
        50% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 8px #fef08a); }
      }
      @keyframes rotateStar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(90deg); }
      }
      .star-core {
        transform-origin: 60px 60px;
        animation: twinkle 4s ease-in-out infinite, rotateStar 10s linear infinite;
      }
      .mini-star-1 { transform-origin: 30px 30px; animation: twinkle 3s ease-in-out 1s infinite; }
      .mini-star-2 { transform-origin: 90px 40px; animation: twinkle 2.5s ease-in-out 0.5s infinite; }
      .mini-star-3 { transform-origin: 40px 90px; animation: twinkle 3.5s ease-in-out 2s infinite; }
    </style>
</defs>

<!-- Center Main Star -->
<g class="star-core">
  <path d="M60 40 L63 57 L80 60 L63 63 L60 80 L57 63 L40 60 L57 57 Z" fill="#fef08a"></path>
  <circle cx="60" cy="60" r="4" fill="#ffffff"></circle>
</g>

<!-- Surrounding Mini Stars -->
<g class="mini-star-1">
  <path d="M30 25 L31 29 L35 30 L31 31 L30 35 L29 31 L25 30 L29 29 Z" fill="#fde047"></path>
</g>
<g class="mini-star-2">
  <path d="M90 35 L91 39 L95 40 L91 41 L90 45 L89 41 L85 40 L89 39 Z" fill="#fde047"></path>
</g>
<g class="mini-star-3">
  <path d="M40 85 L41 89 L45 90 L41 91 L40 95 L39 91 L35 90 L39 89 Z" fill="#fde047"></path>
</g>

</svg>
