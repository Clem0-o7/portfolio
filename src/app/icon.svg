<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
<defs>
<style>
      @keyframes orbit {
        0% { transform: rotateZ(0deg) rotateX(60deg) rotateZ(0deg); }
        100% { transform: rotateZ(360deg) rotateX(60deg) rotateZ(360deg); }
      }
      @keyframes orbitRev {
        0% { transform: rotateZ(0deg) rotateX(70deg) rotateZ(0deg); }
        100% { transform: rotateZ(-360deg) rotateX(70deg) rotateZ(-360deg); }
      }
      @keyframes corePulse {
        0%, 100% { r: 12; filter: drop-shadow(0 0 10px #3b82f6); opacity: 0.8; }
        50% { r: 14; filter: drop-shadow(0 0 20px #60a5fa); opacity: 1; }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .ring-1 {
        transform-origin: 60px 60px;
        animation: orbit 6s linear infinite;
      }
      .ring-2 {
        transform-origin: 60px 60px;
        animation: orbitRev 8s linear infinite;
      }
      .core {
        animation: corePulse 3s ease-in-out infinite;
      }
      .orb-group {
        animation: floatOrb 5s ease-in-out infinite;
      }
    </style>
</defs>

<!-- Ambient Background -->
<circle cx="60" cy="60" r="40" fill="#172554" opacity="0.2"></circle>

<g class="orb-group">
  <!-- Center Core -->
  <circle class="core" cx="60" cy="60" r="12" fill="#bfdbfe"></circle>
  <circle cx="60" cy="60" r="6" fill="#ffffff"></circle>

  <!-- Orbital Rings -->
  <g class="ring-1">
    <ellipse cx="60" cy="60" rx="25" ry="25" fill="none" stroke="#60a5fa" stroke-width="1.5"></ellipse>
    <circle cx="85" cy="60" r="3" fill="#93c5fd"></circle>
  </g>
  
  <g class="ring-2">
    <ellipse cx="60" cy="60" rx="35" ry="35" fill="none" stroke="#3b82f6" stroke-width="1"></ellipse>
    <circle cx="25" cy="60" r="2" fill="#bfdbfe"></circle>
    <circle cx="95" cy="60" r="1.5" fill="#93c5fd"></circle>
  </g>
</g>

</svg>
